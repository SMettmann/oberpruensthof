name: Import Oberpruensthof Images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original website media
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.parse, time
          from pathlib import Path

          out = Path("images")
          out.mkdir(exist_ok=True)
          seen = set()

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def save_url(url):
              if not url or url in seen:
                  return
              seen.add(url)
              try:
                  data = get(url)
              except Exception as e:
                  print("skip", url, e)
                  return
              path = urllib.parse.urlparse(url).path
              name = urllib.parse.unquote(os.path.basename(path)) or "image"
              name = re.sub(r'[^A-Za-z0-9._() -]+','-',name)
              target = out / name
              if target.exists() and target.read_bytes() != data:
                  stem, ext = os.path.splitext(name)
                  target = out / f"{stem}-{abs(hash(url))%100000}{ext}"
              target.write_bytes(data)
              print("saved", target, len(data))

          # WordPress media library: this captures the apartment and farm originals.
          for page in range(1, 25):
              api = f"https://www.oberpruensthof.it/wp-json/wp/v2/media?per_page=100&page={page}"
              try:
                  items = json.loads(get(api))
              except Exception as e:
                  print("media pagination finished:", e)
                  break
              if not items:
                  break
              for item in items:
                  mime = item.get("mime_type","")
                  if mime.startswith("image/"):
                      save_url(item.get("source_url"))
              time.sleep(.2)

          # Also inspect the live homepage for lazy-loaded/srcset images.
          try:
              html = get("https://www.oberpruensthof.it/").decode("utf-8","ignore")
              urls = set(re.findall(r'https?://[^"\'<> ]+/wp-content/uploads/[^"\'<> ,]+', html))
              rels = set(re.findall(r'["\'](/wp-content/uploads/[^"\']+)["\']', html))
              for u in rels:
                  urls.add(urllib.parse.urljoin("https://www.oberpruensthof.it/", u))
              for u in urls:
                  # srcset descriptors can leave HTML entities; strip common trailing junk
                  u = u.replace("&amp;","&").rstrip(");")
                  save_url(u)
          except Exception as e:
              print("homepage scan failed:", e)

          print("TOTAL", len(list(out.iterdir())))
          PY
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No new images"
          else
            git commit -m "Import original Oberpruensthof images"
            git push
          fi
